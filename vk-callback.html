<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logging in with VK…</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh;
           font-family:sans-serif; background:#f5f0e8; color:#1c1917; }
    .box { text-align:center; max-width:320px; }
    .spinner { width:40px; height:40px; border:3px solid #e8e2d9; border-top-color:#c94a2b;
               border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 20px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .msg { font-size:15px; color:#7a7062; }
    .error { color:#c94a2b; font-size:14px; margin-top:16px; }
  </style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <div class="msg" id="msg">Signing in with VK…</div>
  <div class="error" id="err"></div>
</div>
<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const errParam = params.get('error');

  if (errParam || !code) {
    document.getElementById('msg').textContent = '';
    document.getElementById('err').textContent = 'VK login cancelled or failed. Redirecting…';
    setTimeout(() => window.location.href = 'login.html', 2000);
    return;
  }

  try {
    const res = await fetch(
      `${SUPABASE_URL}/functions/v1/vk-callback`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${SUPABASE_ANON}`,
        },
        body: JSON.stringify({
          code,
          redirect_uri: window.location.origin + '/vk-callback.html',
          source: window.location.hostname,
        }),
      }
    );
    const { action_link, error } = await res.json();
    if (error) throw new Error(error);
    window.location.href = action_link;
  } catch (e) {
    document.getElementById('msg').textContent = '';
    document.getElementById('err').textContent = 'Login failed: ' + e.message + '. Redirecting…';
    setTimeout(() => window.location.href = 'login.html', 2500);
  }
})();
</script>
</body>
</html>
